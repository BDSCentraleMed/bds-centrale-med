<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statuts de l'association – BDS Centrale Méditerranée</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
:root{
  --rose:#C2095A;--pink:#E1327E;--orange:#FA972D;--green:#9BCB4D;--blue:#2D60C4;
  --dark:#0a0a0f;--dark2:#0e0e16;--dark3:#151520;--white:#ffffff;
  --muted:rgba(255,255,255,0.5);--radius:10px;--radius-lg:18px;
}
body{font-family:'Inter',sans-serif;color:var(--white);background:var(--dark);overflow-x:hidden;}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;height:68px;
  background:rgba(10,10,15,0.9);backdrop-filter:blur(16px);
  border-bottom:2px solid var(--rose);
}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.nav-brand img{width:42px;height:42px;object-fit:contain;}
.nav-brand-text{display:flex;flex-direction:column;line-height:1.15;}
.nav-brand-text .t1{font-size:0.85rem;font-weight:700;color:var(--white);}
.nav-brand-text .t2{font-size:0.68rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
nav ul{list-style:none;display:flex;gap:2.5rem;align-items:center;}
nav a{text-decoration:none;color:rgba(255,255,255,0.7);font-size:0.85rem;font-weight:500;transition:color .2s;}
nav a:hover{color:var(--white);}
.nav-cta{background:var(--rose)!important;color:white!important;padding:9px 22px;border-radius:50px;font-weight:700!important;font-size:0.82rem!important;letter-spacing:0.05em;text-transform:uppercase;}
.nav-cta:hover{background:var(--pink)!important;}

.colorband{height:4px;background:linear-gradient(to right,var(--rose),var(--pink),var(--orange),var(--green),var(--blue));}

.page-header{
  padding:120px 2rem 4rem;
  background:var(--dark2);
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.page-eyebrow{
  display:inline-block;font-size:0.72rem;font-weight:700;
  letter-spacing:0.18em;text-transform:uppercase;
  padding:5px 16px;border-radius:50px;margin-bottom:1rem;
  background:rgba(194,9,90,0.12);color:var(--pink);
  border:1px solid rgba(194,9,90,0.3);
}
.page-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,4vw,3rem);font-weight:900;
  color:var(--white);margin-bottom:.8rem;
}
.page-title span{color:var(--rose);}
.page-meta{font-size:0.85rem;color:var(--muted);}

.content{max-width:780px;margin:0 auto;padding:4rem 2rem 6rem;}

.article{
  background:var(--dark3);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:var(--radius-lg);
  padding:2rem;margin-bottom:1.2rem;
  border-left:3px solid var(--rose);
  transition:border-left-color .2s;
}
.article:nth-child(3n+2){border-left-color:var(--blue);}
.article:nth-child(3n+3){border-left-color:var(--orange);}
.article:nth-child(3n+1){border-left-color:var(--rose);}
.article h2{
  font-size:0.72rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.6rem;
}
.article h3{
  font-family:'Playfair Display',serif;
  font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:.8rem;
}
.article p{
  font-size:0.88rem;line-height:1.8;color:rgba(255,255,255,0.65);
}
.article ul{
  margin-top:.6rem;padding-left:1rem;display:flex;flex-direction:column;gap:.4rem;
}
.article ul li{
  font-size:0.88rem;line-height:1.7;color:rgba(255,255,255,0.65);
  padding-left:.5rem;
  list-style:none;position:relative;
}
.article ul li::before{
  content:'';position:absolute;left:-0.8rem;top:.65em;
  width:5px;height:5px;border-radius:50%;background:var(--orange);
}
.article .sub{
  margin-top:1rem;padding-top:1rem;
  border-top:1px solid rgba(255,255,255,0.07);
}
.article .sub h4{
  font-size:0.78rem;font-weight:700;color:var(--pink);
  margin-bottom:.4rem;letter-spacing:.05em;
}

.signed{
  background:var(--dark3);border:1px solid rgba(255,255,255,0.07);
  border-radius:var(--radius-lg);padding:2rem;margin-top:1.2rem;
  text-align:center;
}
.signed p{font-size:0.82rem;color:var(--muted);margin-bottom:1.2rem;}
.signed-names{display:flex;justify-content:center;gap:4rem;flex-wrap:wrap;}
.signed-name{text-align:center;}
.signed-name strong{display:block;font-size:0.95rem;color:var(--white);margin-bottom:.2rem;}
.signed-name span{font-size:0.78rem;color:var(--muted);}

.back-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  text-decoration:none;color:var(--muted);font-size:0.85rem;
  margin-bottom:2rem;transition:color .2s;
}
.back-btn:hover{color:var(--white);}
.back-btn::before{content:'←';}

footer{
  background:#050508;
  border-top:4px solid transparent;
  border-image:linear-gradient(to right,var(--rose),var(--pink),var(--orange),var(--green),var(--blue)) 1;
  padding:2rem;text-align:center;
}
footer p{font-size:0.78rem;color:rgba(255,255,255,0.2);}
footer a{color:rgba(255,255,255,0.35);text-decoration:none;margin:0 .8rem;font-size:0.78rem;}
footer a:hover{color:var(--white);}
</style>
</head>
